title: 流量侧 SQL 注入（布尔恒真/恒假条件）
id: f23419de-a69f-5875-a56e-b7a973fb5f20
status: experimental
description: 出现 1 or 1=1 / ' and '1'='1 / and 526=527 这类布尔条件——攻击者在没有回显的情况下，靠页面差异一位一位地把数据猜出来
author: yliucherish
date: '2026-11-14'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_re_1:
    cs-uri-query|re: (?i)\b(?:and|or)\b\s*\(?\s*(?:\d{1,10}|['"’‘][^\s=<>()]{0,12}['"’‘]?)\s*\)?\s*(?:=|<>|!=|>=|<=|>|<|like)\s*\(?\s*(?:\d{1,10}|['"’‘][^\s=<>()]{0,12}['"’‘]?)\s*\)?
  condition: 1 of selection_any_*
falsepositives:
- 渗透测试/漏洞扫描器对自有资产的授权测试
- 自然语言搜索参数里恰好出现 "and/or … = …"（已用"必须有一侧是数字或引号串"收窄）
level: high
