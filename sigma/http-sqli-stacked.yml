# 由 SentinelWatch tools/to_sigma.py 从规则 `http-sqli-stacked` 生成，请勿手改。
# 源规则：rules/*.yaml（https://github.com/yliucherish/sentinelwatch）
# 字段映射：源规则在 `sql_view` 上做匹配，Sigma 侧落在 `cs-uri-query`。
#   移植到具体后端时按目标 schema 替换，例如
#   Elastic → url.query / http.request.body.content；Splunk → uri_query / _raw。
# 判据：含正则（`|re`）。源规则的视图已转小写，这里统一补 `(?i)`，
#   保证在保留大小写的真实字段上不漏报。
# ⚠️ 覆盖面差异：源规则检查整个请求（请求行 + 头部 + body），
#   Sigma 侧只落到一个字段。移植到生产请按后端把 URL / 头部 / body 
#   用 or 拼起来，否则请求头与 body 里的载荷会漏。
# 大小写：Sigma 的 |contains 默认不区分大小写，比源规则（大小写敏感）宽松；
#   需要严格等价请用 `python tools/to_sigma.py --cased` 重新生成。
title: 流量侧 SQL 注入（堆叠语句 / DDL）
id: 72203d92-eb9d-5c47-b049-ac557403b5cb
status: experimental
description: 出现 ; drop table / ; truncate 这类堆叠语句——注入点支持多语句时攻击者会直接改库（这是破坏性最强的一类）
author: yliucherish
date: '2026-11-14'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_re_1:
    cs-uri-query|re: (?i);\s*(?:drop|truncate|alter|create|insert|delete|update|exec|execute|shutdown|grant)\b
  condition: 1 of selection_any_*
falsepositives:
- 把 SQL 脚本作为参数传给运维接口的场景
level: critical
