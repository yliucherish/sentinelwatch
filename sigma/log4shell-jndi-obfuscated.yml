# 由 SentinelWatch tools/to_sigma.py 从规则 `log4shell-jndi-obfuscated` 生成，请勿手改。
# 源规则：rules/*.yaml（https://github.com/yliucherish/sentinelwatch）
# 字段映射：源规则在 `raw` 上做子串匹配，Sigma 侧落在 `message`。
#   移植到具体后端时按目标 schema 替换，例如
#   Elastic → url.query / http.request.body.content；Splunk → uri_query / _raw。
# 大小写：Sigma 的 |contains 默认不区分大小写，比源规则（大小写敏感）宽松；
#   需要严格等价请用 `python tools/to_sigma.py --cased` 重新生成。
title: Log4Shell JNDI 混淆变体
id: 299da695-82ad-53a2-ba96-49b5b8006ab3
status: experimental
description: '攻击者用 log4j 查找嵌套（${lower:j...}/${::-j} 等）绕过对 ${jndi: 的明文过滤'
references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-44228
author: yliucherish
date: '2026-11-04'
tags:
- attack.t1190
- cve.2021-44228
logsource:
  category: webserver
detection:
  selection_any_1:
    message|contains: ${lower:j
  selection_any_2:
    message|contains: ${upper:j
  selection_any_3:
    message|contains: ${::-j
  selection_any_4:
    message|contains: ${env:jndi
  selection_any_5:
    message|contains: ${sys:jndi
  condition: 1 of selection_any_*
falsepositives:
- '业务系统自身拼接 ${lower: 之类的模板语法'
level: high
