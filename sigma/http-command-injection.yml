title: 流量侧 命令注入（系统命令执行）
id: 69a22919-6172-5006-8ad6-17e74599bc21
status: experimental
description: 参数里出现命令分隔符（; | && || 或 $( ) 与反引号）接系统命令名——这是把用户输入拼进 system()/popen() 的典型形态
author: yliucherish
date: '2026-11-14'
tags:
- attack.t1059
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_re_1:
    cs-uri-query|re: (?i)\$\(\s*(?:/bin/|/usr/bin/|/usr/local/bin/)?(?:id|whoami|uname|hostname|pwd|ls|cat|head|tail|wget|curl|nc|ncat|netcat|bash|sh|dash|zsh|ping|nslookup|dig|host|python[23]?|perl|ruby|php|base64|chmod|chown|rm|cp|mv|echo|sleep|telnet|socat|mkfifo|powershell|cmd|certutil|bitsadmin)\b[^)\r\n]{0,60}\)
  selection_any_re_2:
    cs-uri-query|re: (?i)(?<=[=;&|\s("'])`\s*(?:/bin/|/usr/bin/)?(?:id|whoami|uname|hostname|pwd|ls|cat|wget|curl|nc|ncat|bash|sh|ping|nslookup|dig|host|python[23]?|perl|base64|chmod|echo|sleep|powershell|cmd)\s*`
  selection_any_re_3:
    cs-uri-query|re: (?i)(?:;|&&|\|\|)\s*(?:/bin/|/usr/bin/|/usr/local/bin/|c:\\windows\\system32\\)?(?:id|whoami|uname|hostname|pwd|ls|cat|head|tail|wget|curl|nc|ncat|bash|sh|ping|nslookup|dig|host|python[23]?|perl|base64|chmod|chown|rm|cp|mv|echo|sleep|telnet|socat|mkfifo|powershell|cmd|certutil|bitsadmin)(?:\s|$|["'<>&;#])
  selection_any_re_4:
    cs-uri-query|re: (?i)\|\s*(?:/bin/|/usr/bin/)?(?:id|whoami|uname|hostname|pwd|ls|cat|wget|curl|nc|ncat|bash|sh|ping|nslookup|dig|host|python[23]?|perl|base64|chmod|rm|echo|sleep|powershell|cmd)(?:\s+-|\s|$)
  condition: 1 of selection_any_*
falsepositives:
- 多字段排序参数（如 sort=name|id）可能命中单管道分支
- 展示 shell 命令示例的搜索/文档接口
level: critical
