title: 流量侧 SQL 注入（UNION 联合查询）
id: e87c177c-3211-53ae-a3f3-0eb90f7be954
status: experimental
description: URI 或 body 出现 union select 联合查询——最经典的注入手法，攻击者用它把目标表的数据拼到正常查询结果里带出来
author: yliucherish
date: '2026-11-04'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_1:
    cs-uri-query|contains: union select
  selection_any_2:
    cs-uri-query|contains: union all select
  selection_any_3:
    cs-uri-query|contains: union distinct select
  selection_any_4:
    cs-uri-query|contains: union(select
  selection_any_5:
    cs-uri-query|contains: union/\*\*/select
  condition: 1 of selection_any_*
falsepositives:
- 搜索结果页把用户输入原样回显到 SQL 报错里
- 数据库教学/测试平台
level: critical
