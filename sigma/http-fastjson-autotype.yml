title: 流量侧 Fastjson autoType 反序列化载荷
id: 14b7f38b-f50e-5603-af4f-b643be108251
status: experimental
description: HTTP body 出现 @type 且指向已知利用链类（JdbcRowSetImpl / java.lang.Class / AutoCloseable）——请求还没进业务逻辑就已经可判定
references:
- https://nvd.nist.gov/vuln/detail/CVE-2022-25845
author: yliucherish
date: '2026-11-04'
tags:
- attack.t1190
- cve.2022-25845
logsource:
  category: webserver
detection:
  selection_all_1:
    cs-uri-query|contains: '@type'
  selection_any_1:
    cs-uri-query|contains: jdbcrowsetimpl
  selection_any_2:
    cs-uri-query|contains: java.lang.class
  selection_any_3:
    cs-uri-query|contains: autocloseable
  condition: all of selection_all_* and 1 of selection_any_*
falsepositives:
- 接口自动化测试中的合法 @type 用例
level: critical
