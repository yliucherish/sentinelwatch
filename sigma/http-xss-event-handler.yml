title: 流量侧 XSS（事件处理器注入）
id: 7745635d-4850-53ee-b87e-cb697d247e66
status: experimental
description: 出现 <details open ontoggle=alert(1) 这类事件处理器 + 执行函数——不需要 <script> 标签也能执行 JS，是最常见的绕过写法
author: yliucherish
date: '2026-11-14'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_re_1:
    cs-uri-query|re: (?i)<\s*[a-z][a-z0-9]{0,10}\b[^<>]{0,80}\son[a-z]{3,20}\s*=\s*["']?\s*(?:alert|confirm|prompt|eval|atob|document\.|window\.|location|fetch\()
  condition: 1 of selection_any_*
falsepositives:
- 前端组件库的示例代码提交
level: medium
