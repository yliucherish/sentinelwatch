# 由 SentinelWatch tools/to_sigma.py 从规则 `http-java-serialized` 生成，请勿手改。
# 源规则：rules/*.yaml（https://github.com/yliucherish/sentinelwatch）
# 字段映射：源规则在 `normalized` 上做匹配，Sigma 侧落在 `cs-uri-query`。
#   移植到具体后端时按目标 schema 替换，例如
#   Elastic → url.query / http.request.body.content；Splunk → uri_query / _raw。
# 判据：含正则（`|re`）。源规则的视图已转小写，这里统一补 `(?i)`，
#   保证在保留大小写的真实字段上不漏报。
# ⚠️ 覆盖面差异：源规则检查整个请求（请求行 + 头部 + body），
#   Sigma 侧只落到一个字段。移植到生产请按后端把 URL / 头部 / body 
#   用 or 拼起来，否则请求头与 body 里的载荷会漏。
# 大小写：Sigma 的 |contains 默认不区分大小写，比源规则（大小写敏感）宽松；
#   需要严格等价请用 `python tools/to_sigma.py --cased` 重新生成。
title: 流量侧 Java 原生序列化流
id: a5417432-4110-556c-af83-4b5cee8b5998
status: experimental
description: 请求 body 出现 rO0AB（\xAC\xED\x00\x05 的 base64）或 aced0005——正常业务不会用 HTTP 传 Java 序列化对象，出现即为反序列化入口探测
author: yliucherish
date: '2026-11-14'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_re_1:
    cs-uri-query|re: (?i)(?:^|[^a-z0-9+/])ro0ab[a-z0-9+/]{6,}
  selection_any_re_2:
    cs-uri-query|re: (?i)(?:^|[^0-9a-f])aced0005
  condition: 1 of selection_any_*
falsepositives:
- 内部 RPC/管理接口确实以 Java 序列化传输
level: high
