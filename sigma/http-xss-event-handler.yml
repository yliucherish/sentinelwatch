title: 流量侧 XSS（事件处理器注入）
id: 7745635d-4850-53ee-b87e-cb697d247e66
status: experimental
description: 出现 onerror=alert( 这类事件处理器 + 执行函数——不需要 <script> 标签也能执行 JS，是最常见的绕过写法
author: yliucherish
date: '2026-11-04'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_1:
    cs-uri-query|contains: onerror=alert
  selection_any_2:
    cs-uri-query|contains: onload=alert
  selection_any_3:
    cs-uri-query|contains: onmouseover=alert
  selection_any_4:
    cs-uri-query|contains: onfocus=alert
  selection_any_5:
    cs-uri-query|contains: onerror=confirm
  selection_any_6:
    cs-uri-query|contains: onerror=prompt
  condition: 1 of selection_any_*
falsepositives:
- 前端组件库的示例代码提交
level: medium
