title: 流量侧 SQL 注入（元数据/文件探测）
id: 98b491fe-39b2-5520-8db2-ac6c1809ab8a
status: experimental
description: 出现 information_schema / sysobjects / load_file(——注入成功后攻击者第一件事是摸清库结构，或直接读服务器文件
author: yliucherish
date: '2026-11-04'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_1:
    cs-uri-query|contains: information_schema
  selection_any_2:
    cs-uri-query|contains: sysobjects
  selection_any_3:
    cs-uri-query|contains: pg_catalog
  selection_any_4:
    cs-uri-query|contains: load_file(
  selection_any_5:
    cs-uri-query|contains: into outfile
  selection_any_6:
    cs-uri-query|contains: into dumpfile
  condition: 1 of selection_any_*
falsepositives:
- 数据库管理工具（phpMyAdmin 等）的正常操作
level: high
