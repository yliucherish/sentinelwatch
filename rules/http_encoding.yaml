# SentinelWatch 检测规则：编码异常（v2.0）
#
# 这条规则和文件里其他规则不是一类东西，值得单独说明（面试可讲）：
#
#   别的规则匹配**攻击载荷的样子**（`union select`、`<script`、`../`），
#   这条规则匹配**不可能由正常客户端产生的编码**。
#
# 正常浏览器只会输出最短形式的 UTF-8 百分号编码：`/` 一定是 `%2f`，
# 绝不会是 `%c0%af`。后者是 UTF-8 的**超长编码**（overlong encoding）——
# 同一个码位用比必要更多的字节表示，RFC 3629 明确禁止。它唯一的存在理由是
# 绕过只认 `../` 或 `%2e%2e%2f` 的过滤器：有的 Web 服务器/IIS 会把这些
# 非法序列"宽松地"解回 `.` 和 `/`，过滤器却在解码前就放行了。
#
# 所以判据是"这个字节序列在合法流量里根本不出现"，而不是"它长得像攻击"。
# 这类判据的价值在于**误报率天然接近 0**：没有正常客户端会发出它。
#
# 为什么必须在 `raw` 上匹配而不是 `normalized`：
#   `unquote()` 遇到 `%c0%af` 会按 UTF-8 解码并替换成 U+FFFD（非法字节），
#   归一化视图里这个特征就消失了。判据要在**证据**上做，不能在派生物上做——
#   这正好是 v1.9 那条"判据可以归一化、证据不能"的反面用法：
#   **有些判据本身就在证据层**。
#
# 已知限制：只覆盖 UTF-8 超长编码。GBK/UTF-16 的宽松解码（`%bf%27` 之类）
# 属于另一类问题，需要按服务端字符集判断，不在本规则范围内。
rules:
  - id: http-encoding-overlong-utf8
    name: 流量侧 超长 UTF-8 编码（过滤器绕过）
    description: "请求出现 %c0%ae / %c1%9c / %e0%80%af 这类超长 UTF-8 编码——合法客户端不会产生，专门用来绕过只认 ../ 的过滤器"
    severity: high
    event_types: [http_request]
    group_by: [ip]
    window_seconds: 60
    threshold: 1
    suppress_seconds: 600
    sigma:
      logsource: {category: webserver}
      falsepositives:
        - 极少数老式编码转换工具会输出超长编码
    tags:
      - attack.t1190
    match:
      field: raw
      # C0/C1 作为首字节在 UTF-8 里是非法且必然超长的（RFC 3629 禁止），
      # E0 80 则是三字节形式的超长编码。真实业务里这三个前缀出现的概率是 0。
      # 大小写都要覆盖：百分号编码的十六进制位可以大写（%C0%AF）。
      raw_regex:
        - '(?i)%(?:c0|c1)%[0-9a-f]{2}'
        - '(?i)%e0%80%[0-9a-f]{2}'
        - '(?i)%f0%80%80%[0-9a-f]{2}'
