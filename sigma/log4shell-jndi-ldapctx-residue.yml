title: Log4Shell JNDI 查找触达（LdapCtx 残留）
id: 1d67bb5e-bfe3-5148-a3ed-c6a1dc79820d
status: experimental
description: 日志消息被替换为 com.sun.jndi.ldap.LdapCtx@xxxx——JNDI 查询已发生，攻击已触达（即便 RCE 被 JVM 默认策略挡下）
references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-44228
author: yliucherish
date: '2026-11-04'
tags:
- attack.t1190
- cve.2021-44228
logsource:
  category: webserver
detection:
  selection_all_1:
    message|contains: com.sun.jndi.ldap.LdapCtx@
  condition: all of selection_all_*
falsepositives:
- 应用自身打印的 JNDI/LDAP 调试日志
level: high
