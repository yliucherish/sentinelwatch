# 由 SentinelWatch tools/to_sigma.py 从规则 `http-sqli-union-select` 生成，请勿手改。
# 源规则：rules/*.yaml（https://github.com/yliucherish/sentinelwatch）
# 字段映射：源规则在 `sql_view` 上做匹配，Sigma 侧落在 `cs-uri-query`。
#   移植到具体后端时按目标 schema 替换，例如
#   Elastic → url.query / http.request.body.content；Splunk → uri_query / _raw。
# 判据：含正则（`|re`）。源规则的视图已转小写，这里统一补 `(?i)`，
#   保证在保留大小写的真实字段上不漏报。
# ⚠️ 覆盖面差异：源规则检查整个请求（请求行 + 头部 + body），
#   Sigma 侧只落到一个字段。移植到生产请按后端把 URL / 头部 / body 
#   用 or 拼起来，否则请求头与 body 里的载荷会漏。
# 大小写：Sigma 的 |contains 默认不区分大小写，比源规则（大小写敏感）宽松；
#   需要严格等价请用 `python tools/to_sigma.py --cased` 重新生成。
title: 流量侧 SQL 注入（UNION 联合查询）
id: e87c177c-3211-53ae-a3f3-0eb90f7be954
status: experimental
description: URI 或 body 出现 UNION 联合查询——最经典的注入手法，攻击者用它把目标表的数据拼到正常查询结果里带出来
author: yliucherish
date: '2026-11-14'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_re_1:
    cs-uri-query|re: (?i)un\s*ion\s*(?:all\s+|distinct\s+)?\(?\s*se\s*lect
  condition: 1 of selection_any_*
falsepositives:
- 搜索结果页把用户输入原样回显到 SQL 报错里
- 数据库教学/测试平台
- 站内搜索框里恰好输入 "union select"（签名无法区分"引用语法"与"注入"）
level: critical
