title: 流量侧 SSRF（内网 / 云元数据地址）
id: 9dcbeb73-a38c-5821-9b5e-94f97bde5328
status: experimental
description: 参数值指向云元数据服务或内网地址（169.254.169.254 / 127.0.0.1 / 10.x / 192.168.x / 172.16-31.x / file:// / gopher://）——让服务器替攻击者访问它够得着而你够不着的地方
author: yliucherish
date: '2026-11-14'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_re_1:
    cs-uri-query|re: (?i)(?:https?|gopher|dict|ftp|tftp|ldap)://(?:169\.254\.169\.254|100\.100\.100\.200|metadata\.google\.internal)\b
  selection_any_re_2:
    cs-uri-query|re: (?i)(?:https?|gopher|dict|ftp)://(?:127\.\d{1,3}\.\d{1,3}\.\d{1,3}|127(?:\.\d{1,3}){1,2}|localhost|0\.0\.0\.0|\[::1\])
  selection_any_re_3:
    cs-uri-query|re: (?i)(?:https?|gopher|dict|ftp)://\[(?:(?:0:){5}|::)ffff:127\.\d{1,3}\.\d{1,3}\.\d{1,3}\]
  selection_any_re_4:
    cs-uri-query|re: (?i)(?:https?|gopher|dict|ftp)://(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})
  selection_any_re_5:
    cs-uri-query|re: (?i)(?:https?|gopher|dict)://(?:2130706433|0x7f000001|017700000001)\b
  selection_any_re_6:
    cs-uri-query|re: (?i)file:///
  condition: 1 of selection_any_*
falsepositives:
- 内网应用在 Referer / 参数里互相引用内网地址
- 说明文档里贴了 localhost 的示例 URL
level: high
