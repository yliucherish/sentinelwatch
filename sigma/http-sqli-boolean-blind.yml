title: 流量侧 SQL 注入（布尔盲注）
id: f23419de-a69f-5875-a56e-b7a973fb5f20
status: experimental
description: 出现 ' or '1'='1 这类恒真条件——攻击者在没有回显的情况下，靠页面差异一位一位地把数据猜出来
author: yliucherish
date: '2026-11-04'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_all_1:
    cs-uri-query|contains: ''' or '
  selection_any_1:
    cs-uri-query|contains: =1--
  selection_any_2:
    cs-uri-query|contains: =1#
  selection_any_3:
    cs-uri-query|contains: ='1
  selection_any_4:
    cs-uri-query|contains: ="1
  selection_any_5:
    cs-uri-query|contains: 1=1
  selection_any_6:
    cs-uri-query|contains: 1 = 1
  condition: all of selection_all_* and 1 of selection_any_*
falsepositives:
- 渗透测试/漏洞扫描器对自有资产的授权测试
level: high
