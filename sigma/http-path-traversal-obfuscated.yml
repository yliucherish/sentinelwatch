title: 流量侧 路径遍历（编码变体）
id: f1cab0b1-afd5-5bef-8ce5-d2f34c808f39
status: experimental
description: 出现 .../ 三点斜杠、0x2e/0x2f 十六进制编码的 ../、或 \.\ 组合——WAF 只认 ../ 时这些都是绕过写法
author: yliucherish
date: '2026-11-14'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_re_1:
    cs-uri-query|re: (?i)(?:\.{3,}[/\\])|(?:0x2e[^a-z0-9]{0,8}0x(?:2f|5c))|(?:0x(?:2f|5c)[^a-z0-9]{0,8}0x2e)
  condition: 1 of selection_any_*
falsepositives:
- 少数老式 Web 框架用 0x 前缀传参
level: high
