title: Fastjson/JNDI 地址出现在输入中
id: 30448dbe-0eac-583f-9197-af03b1180098
status: experimental
description: 输入里出现 ldap:// 或 rmi:// —— 无论前面用哪种绕过，最终都要落到一个 JNDI 地址上，本条为兜底规则
author: yliucherish
date: '2026-11-04'
tags:
- attack.t1190
logsource:
  category: webserver
detection:
  selection_any_1:
    message|contains: ldap://
  selection_any_2:
    message|contains: rmi://
  condition: 1 of selection_any_*
falsepositives:
- 配置文件同步、运维工具携带的 LDAP 地址
level: critical
