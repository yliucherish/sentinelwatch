# 由 SentinelWatch tools/to_sigma.py 从规则 `http-log4shell-jndi` 生成，请勿手改。
# 源规则：rules/*.yaml（https://github.com/yliucherish/sentinelwatch）
# 字段映射：源规则在 `normalized` 上做匹配，Sigma 侧落在 `cs-uri-query`。
#   移植到具体后端时按目标 schema 替换，例如
#   Elastic → url.query / http.request.body.content；Splunk → uri_query / _raw。
# 判据：含正则（`|re`）。源规则的视图已转小写，这里统一补 `(?i)`，
#   保证在保留大小写的真实字段上不漏报。
# ⚠️ 覆盖面差异：源规则检查整个请求（请求行 + 头部 + body），
#   Sigma 侧只落到一个字段。移植到生产请按后端把 URL / 头部 / body 
#   用 or 拼起来，否则请求头与 body 里的载荷会漏。
# 大小写：Sigma 的 |contains 默认不区分大小写，比源规则（大小写敏感）宽松；
#   需要严格等价请用 `python tools/to_sigma.py --cased` 重新生成。
title: 流量侧 Log4Shell JNDI 注入（CVE-2021-44228）
id: e3fe0232-66d8-53e5-978a-899032df6f74
status: experimental
description: HTTP 请求的 URL / 头部 / body 出现 JNDI 协议串（ndi:ldap:// 等）——即使应用没打日志、或请求被上游 WAF 拦下，流量里也有痕迹
references:
- https://nvd.nist.gov/vuln/detail/CVE-2021-44228
author: yliucherish
date: '2026-11-14'
tags:
- attack.t1190
- cve.2021-44228
logsource:
  category: webserver
detection:
  selection_any_re_1:
    cs-uri-query|re: (?i)ndi:[^\s]{0,40}://
  condition: 1 of selection_any_*
falsepositives:
- 漏洞扫描器对自家资产的授权扫描
- 运维/配置同步接口传递的 LDAP 连接串
level: critical
