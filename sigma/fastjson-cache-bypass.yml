title: Fastjson autoType 缓存绕过（1.2.25–1.2.47）
id: f2641593-501c-5eb3-9a13-3672c97039e8
status: experimental
description: 输入中出现 @type 指定 java.lang.Class——先把类名塞进缓存再引用，可在 autoType 默认关闭的情况下绕过黑名单（实测 RCE）
references:
- https://nvd.nist.gov/vuln/detail/CVE-2022-25845
author: yliucherish
date: '2026-11-04'
tags:
- attack.t1190
- cve.2022-25845
logsource:
  category: webserver
detection:
  selection_all_1:
    message|contains: '@type'
  selection_all_2:
    message|contains: java.lang.Class
  condition: all of selection_all_*
falsepositives:
- 序列化框架自身的调试输出
level: critical
